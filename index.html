<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบคำนวณเวลาทำงาน</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f4f7f6;
            color: #333;
        }
        .main-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            background: #ffffff;
        }
        .header-bg {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            color: white;
            border-radius: 16px 16px 0 0;
            padding: 2rem 1.5rem;
        }
        .day-card {
            border: 1px solid #e9ecef;
            border-radius: 12px;
            transition: all 0.2s ease;
            background: #fff;
        }
        .day-card:hover {
            border-color: #0d6efd;
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.1);
        }
        .result-box {
            background: linear-gradient(135deg, #198754 0%, #146c43 100%);
            color: white;
            border-radius: 12px;
        }
        .time-badge {
            font-size: 2rem;
            font-weight: 700;
        }
        .form-select, .form-control {
            border-radius: 8px;
            border: 1px solid #ced4da;
        }
        .form-select:focus, .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }
    </style>
</head>
<body class="py-4 py-md-5">

<div class="container" style="max-width: 800px;">
    <div class="card main-card">
        <div class="header-bg text-center">
            <h2 class="fw-bold mb-1"><i class="fa-solid fa-calculator me-2"></i>ระบบคำนวณเวลาทำงาน</h2>
            <p class="mb-0 opacity-75">บันทึกเวลาเข้า-ออกงาน หักเวลาพัก และคำนวณเวลารวม (สูงสุด 7 วัน)</p>
        </div>
        
        <div class="card-body p-4">
            <!-- รายการวันทำงาน -->
            <div id="daysContainer" class="d-flex flex-column gap-3 mb-4">
                <!-- โค้ดส่วนนี้จะถูกเพิ่มด้วย JavaScript -->
            </div>

            <!-- ปุ่มจัดการ -->
            <div class="d-flex flex-wrap gap-2 mb-4 justify-content-between">
                <button type="button" id="addDayBtn" class="btn btn-outline-primary fw-medium px-3">
                    <i class="fa-solid fa-plus me-1"></i> เพิ่มวันทำงาน
                </button>
                <div class="d-flex gap-2">
                    <button type="button" id="resetBtn" class="btn btn-outline-danger fw-medium">
                        <i class="fa-solid fa-rotate-left me-1"></i> ล้างข้อมูล
                    </button>
                    <button type="button" id="calculateBtn" class="btn btn-primary fw-bold px-4">
                        <i class="fa-solid fa-calculator me-1"></i> คำนวณเวลา
                    </button>
                </div>
            </div>

            <!-- กล่องแสดงผลลัพธ์ -->
            <div id="resultCard" class="result-box p-4 text-center d-none">
                <h5 class="fw-normal mb-2 text-white-50">เวลารวมทั้งหมดในการทำงาน</h5>
                <div id="totalTimeDisplay" class="time-badge mb-3">0 ชั่วโมง 0 นาที</div>
                <div id="dailyBreakdown" class="text-start bg-white bg-opacity-10 p-3 rounded-3 mt-3">
                    <div class="fw-bold mb-2 border-bottom border-white border-opacity-25 pb-1">รายละเอียดรายวัน:</div>
                    <ul id="breakdownList" class="list-unstyled mb-0 small"></ul>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const daysContainer = document.getElementById('daysContainer');
    const addDayBtn = document.getElementById('addDayBtn');
    const calculateBtn = document.getElementById('calculateBtn');
    const resetBtn = document.getElementById('resetBtn');
    const resultCard = document.getElementById('resultCard');
    const totalTimeDisplay = document.getElementById('totalTimeDisplay');
    const breakdownList = document.getElementById('breakdownList');

    const dayOptions = ['วันจันทร์', 'วันอังคาร', 'วันพุธ', 'วันพฤหัสบดี', 'วันศุกร์', 'วันเสาร์', 'วันอาทิตย์'];

    function createTimeOptions(max, isHour = true) {
        let options = '';
        for (let i = 0; i <= max; i++) {
            const val = i.toString().padStart(2, '0');
            options += `<option value="${i}">${val}</option>`;
        }
        return options;
    }

    const hoursOptionsHtml = createTimeOptions(23, true);
    const minutesOptionsHtml = createTimeOptions(59, false);

    function addDay(selectedDayIndex = null) {
        const currentCount = daysContainer.children.length;
        if (currentCount >= 7) {
            alert('เพิ่มได้สูงสุด 7 วันเท่านั้นครับ');
            return;
        }

        const dayId = Date.now() + Math.random();
        const defaultDayIndex = selectedDayIndex !== null ? selectedDayIndex : currentCount % 7;

        let daySelectHtml = `<select class="form-select day-name fw-medium" style="max-width: 150px;">`;
        dayOptions.forEach((day, idx) => {
            const selected = idx === defaultDayIndex ? 'selected' : '';
            daySelectHtml += `<option value="${day}" ${selected}>${day}</option>`;
        });
        daySelectHtml += `</select>`;

        const dayCard = document.createElement('div');
        dayCard.className = 'day-card p-3';
        dayCard.id = `day-${dayId}`;
        dayCard.innerHTML = `
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="d-flex align-items-center gap-2">
                    <i class="fa-solid fa-calendar-day text-primary"></i>
                    ${daySelectHtml}
                </div>
                <button type="button" class="btn btn-sm btn-outline-danger remove-btn border-0" onclick="removeDay('day-${dayId}')">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            </div>
            <div class="row g-3">
                <div class="col-md-5">
                    <label class="form-label small text-muted mb-1"><i class="fa-regular fa-clock text-success me-1"></i>เวลาเข้างาน</label>
                    <div class="d-flex align-items-center gap-1">
                        <select class="form-select in-hour">${hoursOptionsHtml}</select>
                        <span>:</span>
                        <select class="form-select in-min">${minutesOptionsHtml}</select>
                        <span class="small text-muted ms-1">น.</span>
                    </div>
                </div>
                <div class="col-md-5">
                    <label class="form-label small text-muted mb-1"><i class="fa-regular fa-clock text-danger me-1"></i>เวลาออกงาน</label>
                    <div class="d-flex align-items-center gap-1">
                        <select class="form-select out-hour">${hoursOptionsHtml}</select>
                        <span>:</span>
                        <select class="form-select out-min">${minutesOptionsHtml}</select>
                        <span class="small text-muted ms-1">น.</span>
                    </div>
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted mb-1"><i class="fa-solid fa-mug-hot text-warning me-1"></i>พัก (นาที)</label>
                    <input type="number" class="form-control break-min" min="0" value="60" placeholder="นาที">
                </div>
            </div>
        `;

        daysContainer.appendChild(dayCard);
        updateAddButtonState();
    }

    function removeDay(id) {
        if (daysContainer.children.length <= 1) {
            alert('ต้องมีอย่างน้อย 1 วันครับ');
            return;
        }
        const elem = document.getElementById(id);
        if (elem) elem.remove();
        updateAddButtonState();
    }

    function updateAddButtonState() {
        if (daysContainer.children.length >= 7) {
            addDayBtn.classList.add('disabled');
        } else {
            addDayBtn.classList.remove('disabled');
        }
    }

    function calculateTotalTime() {
        let totalMinutesAllDays = 0;
        breakdownList.innerHTML = '';
        let valid = true;

        const dayCards = daysContainer.querySelectorAll('.day-card');
        dayCards.forEach((card, index) => {
            const dayName = card.querySelector('.day-name').value;
            const inH = parseInt(card.querySelector('.in-hour').value) || 0;
            const inM = parseInt(card.querySelector('.in-min').value) || 0;
            const outH = parseInt(card.querySelector('.out-hour').value) || 0;
            const outM = parseInt(card.querySelector('.out-min').value) || 0;
            const breakM = parseInt(card.querySelector('.break-min').value) || 0;

            let inTotalMinutes = (inH * 60) + inM;
            let outTotalMinutes = (outH * 60) + outM;

            // กรณีทำงานข้ามคืน (ออกงานน้อยกว่าเข้างาน)
            if (outTotalMinutes < inTotalMinutes) {
                outTotalMinutes += 24 * 60;
            }

            let workMinutes = outTotalMinutes - inTotalMinutes - breakM;

            if (workMinutes < 0) workMinutes = 0;

            totalMinutesAllDays += workMinutes;

            const workH = Math.floor(workMinutes / 60);
            const workM = workMinutes % 60;

            const li = document.createElement('li');
            li.className = 'py-1 border-bottom border-white border-opacity-10 d-flex justify-content-between';
            li.innerHTML = `<span>${dayName} (พัก ${breakM} นาที)</span> <span>${workH} ชม. ${workM} นาที</span>`;
            breakdownList.appendChild(li);
        });

        const finalH = Math.floor(totalMinutesAllDays / 60);
        const finalM = totalMinutesAllDays % 60;

        totalTimeDisplay.textContent = `${finalH} ชั่วโมง ${finalM} นาที`;
        resultCard.classList.remove('d-none');
        resultCard.scrollIntoView({ behavior: 'smooth' });
    }

    function resetForm() {
        daysContainer.innerHTML = '';
        for (let i = 0; i < 5; i++) {
            addDay(i);
        }
        resultCard.classList.add('d-none');
    }

    addDayBtn.addEventListener('click', () => addDay());
    calculateBtn.addEventListener('click', calculateTotalTime);
    resetBtn.addEventListener('click', resetForm);

    // เริ่มต้นสร้างไว้ 5 วันแรก (จันทร์ - ศุกร์)
    for (let i = 0; i < 5; i++) {
        addDay(i);
    }
</script>
</body>
</html>
